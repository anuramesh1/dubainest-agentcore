[pytest]
pythonpath = .
testpaths = api agent
# Deprecation notices raised inside third-party libraries, not this code
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:botocore
    ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning
    ignore:datetime.datetime.utcnow:DeprecationWarning:bedrock_agentcore
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
