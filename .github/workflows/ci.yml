name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python: api/ + agent/ + evals (added in build steps 2-3) ───
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (lint)
        run: |
          pip install ruff
          ruff check scripts data $(ls -d api agent evals 2>/dev/null)
      - name: Seed catalogue loads
        run: python -c "import sys; sys.path.insert(0, 'data'); from mock_properties import PROPERTIES; assert len(PROPERTIES) == 20"

  # ─── Frontend: lint + build (copied unchanged from dubainest-ai) ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # ─── Infra: cdk synth ───
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx cdk synth --quiet
