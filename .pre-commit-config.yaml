# ─────────────────────────────────────────────────────────
# DubaiNest AI · pre-commit configuration
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# ─────────────────────────────────────────────────────────
default_language_version:
  python: python3.11
  node: "20.11.0"

repos:
  # ── General hygiene ────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Python: Black (formatter) ──────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        files: ^(api|agent|data|scripts|evals)/.*\.py$

  # ── Python: Ruff (linter + import sorting) ─────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(api|agent|data|scripts|evals)/.*\.py$

  # ── Python: mypy (type checking) ───────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^(api|agent)/.*\.py$
        additional_dependencies:
          - pydantic>=2.7.0
          - types-requests
        args: [--ignore-missing-imports, --no-strict-optional]

  # ── Prettier (Angular, JSON, YAML, Markdown) ───────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(frontend|infra)/.*\.(ts|js|html|scss|css|json|yaml|yml|md)$
        exclude: ^(.*/dist/|.*/node_modules/|.*/cdk\.out/)

  # ── ESLint (disabled — CDK infra uses tsc + prettier; Angular uses ng lint) ─
  # ESLint requires packages resolvable from the repo root which conflicts with
  # pre-commit's isolated env. tsc covers type safety; prettier covers formatting.
  # - repo: https://github.com/pre-commit/mirrors-eslint

  # ── Conventional commit messages ───────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - revert
