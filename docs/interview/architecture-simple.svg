<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .t  { font-size: 26px; font-weight: 700; fill: #0f172a; }
    .st { font-size: 15px; fill: #475569; }
    .h  { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .b  { font-size: 14px; fill: #334155; }
    .s  { font-size: 12.5px; fill: #64748b; }
    .lbl { font-size: 12.5px; fill: #475569; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
    .ac  { fill: #f0f6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
    .node { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
    .agent { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
    .gate { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 8; }
    .data { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
    .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .gflow { stroke: #2563eb; stroke-width: 1.5; fill: none; marker-end: url(#arrb); }
    .dash { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="40" y="46" class="t">DubaiNest AgentCore</text>
  <text x="40" y="70" class="st">A question travels Browser → CloudFront → Lambda → AgentCore; the answer streams back the same way. Nothing bills while idle.</text>

  <!-- ===== Row 1: request path ===== -->
  <rect x="40" y="110" width="250" height="90" class="box"/>
  <text x="165" y="137" text-anchor="middle" class="h">Browser</text>
  <text x="165" y="159" text-anchor="middle" class="b">Angular app: listings, map, chat</text>
  <text x="165" y="178" text-anchor="middle" class="s">session per chat window · visitor id kept</text>

  <rect x="395" y="110" width="250" height="90" class="box"/>
  <text x="520" y="137" text-anchor="middle" class="h">CloudFront</text>
  <text x="520" y="159" text-anchor="middle" class="b">/* → S3 site · /api/* → Lambda</text>
  <text x="520" y="178" text-anchor="middle" class="s">signs the request; only it may call the Lambda</text>

  <rect x="750" y="110" width="250" height="90" class="box"/>
  <text x="875" y="137" text-anchor="middle" class="h">api Lambda</text>
  <text x="875" y="159" text-anchor="middle" class="b">FastAPI · listings API · chat relay</text>
  <text x="875" y="178" text-anchor="middle" class="s">injection screen · 20/min per IP, 200/day</text>

  <rect x="1105" y="110" width="255" height="90" class="box" style="stroke:#2563eb; stroke-width:2"/>
  <text x="1232" y="137" text-anchor="middle" class="h">AgentCore Runtime</text>
  <text x="1232" y="159" text-anchor="middle" class="b">one microVM per chat session</text>
  <text x="1232" y="178" text-anchor="middle" class="s">runs the LangGraph graph below</text>

  <line x1="290" y1="148" x2="393" y2="148" class="flow"/>
  <text x="341" y="141" text-anchor="middle" class="lbl">POST /api/chat</text>
  <line x1="645" y1="148" x2="748" y2="148" class="flow"/>
  <text x="696" y="141" text-anchor="middle" class="lbl">signed</text>
  <line x1="1000" y1="148" x2="1103" y2="148" class="flow"/>
  <text x="1051" y="141" text-anchor="middle" class="lbl">invoke</text>
  <line x1="1232" y1="200" x2="1232" y2="222" class="flow" style="marker-end:none"/>
  <line x1="1232" y1="222" x2="165" y2="222" class="flow" style="marker-end:none"/>
  <line x1="165" y1="222" x2="165" y2="202" class="flow"/>
  <text x="696" y="240" text-anchor="middle" class="lbl">SSE stream: status → text → suggestions → done</text>

  <!-- ===== Row 2: the graph inside AgentCore ===== -->
  <rect x="40" y="250" width="1320" height="280" class="ac"/>
  <text x="60" y="280" class="h">Inside AgentCore: LangGraph orchestrates Strands agents</text>
  <text x="60" y="300" class="s">LangGraph decides who answers, what may be said and what is remembered. Each Strands agent (Claude Haiku) answers with its own tools.</text>

  <!-- load_memory -->
  <rect x="60" y="340" width="150" height="70" class="node"/>
  <text x="135" y="368" text-anchor="middle" class="b" font-weight="700">load memory</text>
  <text x="135" y="390" text-anchor="middle" class="s">visitor profile</text>

  <!-- router -->
  <rect x="260" y="340" width="150" height="70" class="node"/>
  <text x="335" y="368" text-anchor="middle" class="b" font-weight="700">router</text>
  <text x="335" y="390" text-anchor="middle" class="s">Nova Micro</text>

  <!-- agents column -->
  <rect x="470" y="322" width="330" height="106" class="agent"/>
  <text x="635" y="345" text-anchor="middle" class="b" font-weight="700">Strands agents + tools</text>
  <text x="635" y="368" text-anchor="middle" class="s">property · search_listings, compare</text>
  <text x="635" y="386" text-anchor="middle" class="s">market · area_market  |  roi · calculate_roi</text>
  <text x="635" y="404" text-anchor="middle" class="s">viewing · request_viewing  |  general</text>
  <text x="635" y="421" text-anchor="middle" class="s">answers stream out as they are written</text>

  <!-- fixed replies -->
  <rect x="470" y="448" width="400" height="60" class="node" style="stroke-dasharray: 5 4"/>
  <text x="670" y="472" text-anchor="middle" class="b">no-model paths (no agent, no gate)</text>
  <text x="670" y="492" text-anchor="middle" class="s">"yes" → confirm viewing (writes the lead) · off-topic → fixed reply</text>

  <!-- gate -->
  <rect x="860" y="340" width="190" height="70" class="gate"/>
  <text x="955" y="365" text-anchor="middle" class="b" font-weight="700">output gate</text>
  <text x="955" y="385" text-anchor="middle" class="s">drops "let me check…" narration</text>
  <text x="955" y="401" text-anchor="middle" class="s">blocks any unverified AED figure</text>

  <!-- remember -->
  <rect x="1110" y="340" width="230" height="70" class="node"/>
  <text x="1225" y="368" text-anchor="middle" class="b" font-weight="700">remember</text>
  <text x="1225" y="390" text-anchor="middle" class="s">profile → store · turn → checkpoint</text>

  <!-- graph flows -->
  <line x1="210" y1="375" x2="258" y2="375" class="gflow"/>
  <line x1="410" y1="375" x2="468" y2="375" class="gflow"/>
  <line x1="410" y1="385" x2="440" y2="385" class="gflow" style="marker-end:none"/>
  <path d="M440,385 L440,478 L468,478" class="gflow"/>
  <line x1="800" y1="375" x2="858" y2="375" class="gflow"/>
  <line x1="1050" y1="375" x2="1108" y2="375" class="gflow"/>
  <path d="M870,478 L1135,478 L1135,412" class="gflow"/>

  <text x="1148" y="455" class="s">Conversation → checkpointer, 24 h</text>
  <text x="1148" y="473" class="s">Visitor profile → store, 90 days</text>
  <text x="1148" y="491" class="s">in DynamoDB; no contact details</text>
  <line x1="1250" y1="410" x2="1250" y2="440" class="dash"/>

  <text x="60" y="515" class="s">Typical question: 3 model calls · first text at ~3 s · about $0.007</text>

  <!-- ===== Row 3: data and models ===== -->
  <text x="40" y="580" class="h">Data and models, all on demand</text>

  <rect x="40" y="600" width="300" height="120" class="data"/>
  <text x="60" y="628" class="b" font-weight="700">Amazon Bedrock</text>
  <text x="60" y="652" class="b">Nova Micro — routing</text>
  <text x="60" y="672" class="b">Claude Haiku 4.5 — the agents</text>
  <text x="60" y="692" class="b">Titan Embeddings — hybrid search</text>

  <rect x="380" y="600" width="300" height="120" class="data"/>
  <text x="400" y="628" class="b" font-weight="700">DynamoDB</text>
  <text x="400" y="652" class="b">Properties (20 listings) · Leads</text>
  <text x="400" y="672" class="b">Sessions · Memory (TTL)</text>
  <text x="400" y="692" class="b">Limits (rate-cap counters)</text>

  <rect x="720" y="600" width="300" height="120" class="data"/>
  <text x="740" y="628" class="b" font-weight="700">S3</text>
  <text x="740" y="652" class="b">Site bucket — Angular build</text>
  <text x="740" y="672" class="b">Agent data — 38 KB vector index</text>
  <text x="740" y="692" class="s">no vector database</text>

  <rect x="1060" y="600" width="300" height="120" class="data"/>
  <text x="1080" y="628" class="b" font-weight="700">Everything as CDK</text>
  <text x="1080" y="652" class="b">AgentStack · ApiStack · FrontendStack</text>
  <text x="1080" y="672" class="b">Idle cost ≈ $0.10–0.30 / month</text>
  <text x="1080" y="692" class="s">no NAT, ALB, Fargate or OpenSearch</text>

  <line x1="190" y1="600" x2="190" y2="532" class="dash"/>
  <line x1="530" y1="600" x2="530" y2="532" class="dash"/>
  <line x1="870" y1="600" x2="870" y2="532" class="dash"/>
</svg>
