<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DubaiNest AgentCore architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .edge { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .runtime { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6 4; }
      .lg { fill: #ffffff; stroke: #6366f1; stroke-width: 1.5; }
      .strands { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .gate { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .fixed { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .data { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
      .model { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .h { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 11.5px; fill: #64748b; }
      .k { font-size: 12px; font-weight: 600; fill: #1e293b; }
      .lbl { font-size: 11.5px; fill: #2563eb; font-weight: 600; }
      .lblg { font-size: 11.5px; fill: #059669; font-weight: 600; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
      .blue { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .green { stroke: #059669; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="24" font-weight="800" fill="#0f172a">DubaiNest AgentCore</text>
  <text x="30" y="64" class="t">LangGraph orchestrates Strands agents on Amazon Bedrock AgentCore Runtime · Lambda relay · DynamoDB memory · nothing bills hourly while idle</text>

  <!-- ── Browser ─────────────────────────────────────────── -->
  <rect x="30" y="120" width="220" height="190" rx="12" class="box"/>
  <text x="48" y="148" class="h">Browser</text>
  <text x="48" y="172" class="t">Angular 17 SPA</text>
  <text x="48" y="194" class="s">• listings, filters, map, detail</text>
  <text x="48" y="212" class="s">• chat panel (SSE reader)</text>
  <text x="48" y="230" class="s">• SHA-256 body hash on POST</text>
  <text x="48" y="248" class="s">• session_id per chat window</text>
  <text x="48" y="266" class="s">• visitor_id in localStorage</text>
  <text x="48" y="292" class="k">POST /api/chat → SSE</text>

  <!-- ── CloudFront ──────────────────────────────────────── -->
  <rect x="300" y="120" width="270" height="190" rx="12" class="edge"/>
  <text x="318" y="148" class="h">Amazon CloudFront</text>
  <text x="318" y="172" class="t">one domain for UI and API</text>
  <text x="318" y="194" class="s">• /*  → S3 (OAC) + SPA-rewrite function</text>
  <text x="318" y="212" class="s">• /api/* → Lambda Function URL (OAC,</text>
  <text x="318" y="228" class="s">   SigV4-signed by CloudFront)</text>
  <text x="318" y="246" class="s">• forwards CloudFront-Viewer-Address</text>
  <text x="318" y="264" class="s">   for the per-IP cap</text>
  <text x="318" y="292" class="k">no caching on /api/*</text>

  <!-- ── api Lambda ──────────────────────────────────────── -->
  <rect x="620" y="110" width="290" height="300" rx="12" class="aws"/>
  <text x="638" y="138" class="h">api Lambda</text>
  <text x="638" y="160" class="t">FastAPI under Lambda Web Adapter</text>
  <text x="638" y="178" class="s">arm64 image · Function URL: AWS_IAM,</text>
  <text x="638" y="194" class="s">RESPONSE_STREAM · reserved concurrency 3</text>
  <line x1="638" y1="206" x2="892" y2="206" stroke="#fdba74"/>
  <text x="638" y="226" class="k">Listings &amp; enquiries</text>
  <text x="638" y="243" class="s">properties, facets, detail, property-intro,</text>
  <text x="638" y="259" class="s">enquiry form → Leads</text>
  <text x="638" y="283" class="k">POST /api/chat</text>
  <text x="638" y="301" class="s">1. guard_in: injection regex, 2,000 chars</text>
  <text x="638" y="318" class="s">2. caps: 20/min per IP, 200/day (atomic</text>
  <text x="638" y="334" class="s">    DynamoDB counters)</text>
  <text x="638" y="351" class="s">3. InvokeAgentRuntime, one session per</text>
  <text x="638" y="367" class="s">    chat window</text>
  <text x="638" y="384" class="s">4. relay SSE bytes unchanged (read1)</text>

  <!-- ── AgentCore Runtime ───────────────────────────────── -->
  <rect x="960" y="92" width="510" height="640" rx="16" class="runtime"/>
  <text x="980" y="120" class="h">Amazon Bedrock AgentCore Runtime</text>
  <text x="980" y="140" class="s">arm64 microVM per session · PUBLIC network (no VPC/NAT) · BedrockAgentCoreApp :8080</text>

  <!-- LangGraph label -->
  <text x="980" y="168" font-size="13" font-weight="700" fill="#4f46e5">LangGraph StateGraph (orchestration, state, memory, guardrails)</text>

  <rect x="1130" y="180" width="180" height="40" rx="8" class="lg"/>
  <text x="1220" y="198" text-anchor="middle" class="k">load_memory</text>
  <text x="1220" y="213" text-anchor="middle" class="s">profile from store</text>

  <rect x="1130" y="240" width="180" height="44" rx="8" class="lg"/>
  <text x="1220" y="259" text-anchor="middle" class="k">router</text>
  <text x="1220" y="275" text-anchor="middle" class="s">Nova Micro · keyword fallback</text>

  <!-- agents -->

  <rect x="978" y="326" width="92" height="56" rx="8" class="strands"/>
  <text x="1024" y="349" text-anchor="middle" class="k">property</text>
  <text x="1024" y="366" text-anchor="middle" class="s">search · get</text>
  <text x="1024" y="378" text-anchor="middle" class="s">compare</text>
  <rect x="1076" y="326" width="92" height="56" rx="8" class="strands"/>
  <text x="1122" y="349" text-anchor="middle" class="k">market</text>
  <text x="1122" y="366" text-anchor="middle" class="s">area_market</text>
  <rect x="1174" y="326" width="92" height="56" rx="8" class="strands"/>
  <text x="1220" y="349" text-anchor="middle" class="k">roi</text>
  <text x="1220" y="366" text-anchor="middle" class="s">calculate_roi</text>
  <rect x="1272" y="326" width="92" height="56" rx="8" class="strands"/>
  <text x="1318" y="349" text-anchor="middle" class="k">viewing</text>
  <text x="1318" y="366" text-anchor="middle" class="s">request_viewing</text>
  <rect x="1370" y="326" width="92" height="56" rx="8" class="strands"/>
  <text x="1416" y="349" text-anchor="middle" class="k">general</text>
  <text x="1416" y="366" text-anchor="middle" class="s">catalogue</text>

  <text x="1220" y="394" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Strands agents (Claude Haiku 4.5), each with its own @tool functions</text>
  <!-- gate -->
  <rect x="978" y="402" width="484" height="46" rx="8" class="gate"/>
  <text x="1220" y="420" text-anchor="middle" class="k">output gate</text>
  <text x="1220" y="438" text-anchor="middle" class="s">drops narration · checks each sentence's AED figures · stops on a mismatch</text>

  <!-- fixed nodes -->
  <rect x="978" y="462" width="230" height="44" rx="8" class="fixed"/>
  <text x="1093" y="481" text-anchor="middle" class="k">confirm_viewing</text>
  <text x="1093" y="497" text-anchor="middle" class="s">router: "yes" → write lead, no model</text>
  <rect x="1232" y="462" width="230" height="44" rx="8" class="fixed"/>
  <text x="1347" y="481" text-anchor="middle" class="k">off_topic</text>
  <text x="1347" y="497" text-anchor="middle" class="s">router: fixed reply, no agent</text>

  <rect x="1130" y="526" width="180" height="40" rx="8" class="lg"/>
  <text x="1220" y="544" text-anchor="middle" class="k">remember</text>
  <text x="1220" y="559" text-anchor="middle" class="s">profile → store · turn → state</text>

  <text x="980" y="594" class="s">Checkpointer saves session state once per question; the store keeps the profile.</text>
  <text x="980" y="612" class="s">Streams: status → chunk… → suggestions → done · ~3 model calls, ~$0.007, text at ~3 s</text>

  <!-- graph edges -->
  <line x1="1220" y1="220" x2="1220" y2="238" class="line" marker-end="url(#arrow)"/>
  <path d="M1220,284 L1220,300 L1024,300 L1024,324" class="line" marker-end="url(#arrow)"/>
  <line x1="1220" y1="300" x2="1220" y2="324" class="line" marker-end="url(#arrow)"/>
  <path d="M1220,300 L1416,300 L1416,324" class="line" marker-end="url(#arrow)"/>
  <line x1="1122" y1="300" x2="1122" y2="324" class="line" marker-end="url(#arrow)"/>
  <line x1="1318" y1="300" x2="1318" y2="324" class="line" marker-end="url(#arrow)"/>
  <line x1="1220" y1="382" x2="1220" y2="382" class="line"/>
  <line x1="1220" y1="448" x2="1220" y2="524" class="line" marker-end="url(#arrow)"/>

  <path d="M1093,506 L1093,546 L1128,546" class="line" marker-end="url(#arrow)"/>
  <path d="M1347,506 L1347,546 L1312,546" class="line" marker-end="url(#arrow)"/>

  <!-- AgentCore container label -->
  <rect x="980" y="636" width="470" height="80" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="996" y="658" class="k">Container (agent/Dockerfile)</text>
  <text x="996" y="676" class="s">langgraph · strands-agents · langgraph-checkpoint-aws · bedrock-agentcore</text>
  <text x="996" y="694" class="s">Listings: one DynamoDB Scan per microVM · vector index from S3 on first use</text>
  <text x="996" y="710" class="s">Sessions end after 5 idle minutes; billed only while a session is alive</text>

  <!-- ── Request path arrows ─────────────────────────────── -->
  <line x1="250" y1="200" x2="298" y2="200" class="blue" marker-end="url(#arrowBlue)"/>
  <text x="252" y="190" class="lbl">HTTPS</text>
  <line x1="570" y1="200" x2="618" y2="200" class="blue" marker-end="url(#arrowBlue)"/>
  <text x="572" y="190" class="lbl">SigV4</text>
  <line x1="910" y1="200" x2="958" y2="200" class="blue" marker-end="url(#arrowBlue)"/>
  <text x="914" y="190" class="lbl">invoke</text>

  <!-- streaming back -->
  <path d="M958,240 L930,240" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M618,240 L572,240" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M298,240 L252,240" class="green" marker-end="url(#arrowGreen)"/>
  <text x="258" y="258" class="lblg">SSE</text>
  <text x="572" y="258" class="lblg">SSE</text>
  <text x="914" y="258" class="lblg">SSE</text>

  <!-- ── Data & models layer ─────────────────────────────── -->
  <text x="30" y="790" font-size="13" font-weight="700" fill="#0f172a">Data and models (all on demand)</text>

  <rect x="300" y="805" width="270" height="70" rx="10" class="data"/>
  <text x="318" y="830" class="k">S3 site bucket</text>
  <text x="318" y="848" class="s">Angular build, private (OAC)</text>
  <text x="318" y="864" class="s">photos: shared assets bucket + CDN</text>

  <rect x="620" y="805" width="290" height="110" rx="10" class="data"/>
  <text x="638" y="830" class="k">DynamoDB (shared with dubainest-ai)</text>
  <text x="638" y="849" class="s">Properties: 20 listings (source of truth)</text>
  <text x="638" y="866" class="s">Leads: enquiries + confirmed viewings</text>
  <text x="638" y="890" class="k">DynamoDB (this project)</text>
  <text x="638" y="907" class="s">Limits: per-IP / daily counters, TTL</text>

  <rect x="960" y="760" width="250" height="110" rx="10" class="model"/>
  <text x="978" y="785" class="k">Amazon Bedrock</text>
  <text x="978" y="805" class="s">Nova Micro: router (structured output)</text>
  <text x="978" y="823" class="s">Claude Haiku 4.5: Strands agents</text>
  <text x="978" y="841" class="s">Titan Text Embeddings v2: query</text>
  <text x="978" y="857" class="s">   vector for hybrid search</text>

  <rect x="1230" y="760" width="240" height="110" rx="10" class="data"/>
  <text x="1248" y="785" class="k">Memory (DynamoDB, TTL)</text>
  <text x="1248" y="805" class="s">sessions: LangGraph checkpointer,</text>
  <text x="1248" y="821" class="s">   per chat session, 24 h</text>
  <text x="1248" y="841" class="s">memory: LangGraph store, visitor</text>
  <text x="1248" y="857" class="s">   profile, 90 days (no contact info)</text>

  <rect x="960" y="885" width="250" height="56" rx="10" class="data"/>
  <text x="978" y="908" class="k">S3 agent data bucket</text>
  <text x="978" y="926" class="s">listings_index.npz (20 × 512 Titan vectors)</text>

  <!-- data edges -->
  <path d="M570,290 L595,290 L595,840 L572,840" class="line" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="765" y1="410" x2="765" y2="803" class="line" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="1085" y1="732" x2="1085" y2="758" class="line" marker-end="url(#arrow)"/>
  <line x1="1350" y1="732" x2="1350" y2="758" class="line" marker-end="url(#arrow)"/>
  <path d="M960,700 L935,700 L935,860 L912,860" class="line" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="s" text-anchor="middle" transform="translate(950 790) rotate(-90)">listings, leads</text>
  <path d="M1212,913 L1222,913 L1222,732" class="line" stroke-dasharray="4 4" marker-start="url(#arrow)"/>

  <!-- ── Footer: IaC + guardrails ────────────────────────── -->
  <rect x="30" y="330" width="540" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="358" class="h">Guardrails and cost controls</text>
  <text x="48" y="384" class="t">Before any agent starts (api Lambda, free)</text>
  <text x="60" y="404" class="s">• regex prompt-injection screen, 2,000-character cap</text>
  <text x="60" y="421" class="s">• 20 questions/min per visitor IP, 200/day site-wide</text>
  <text x="60" y="438" class="s">• Function URL accepts only CloudFront-signed requests</text>
  <text x="48" y="466" class="t">Inside the graph</text>
  <text x="60" y="486" class="s">• off-topic answered by a fixed reply, no agent</text>
  <text x="60" y="503" class="s">• output gate: no ungrounded AED figure ever reaches the user</text>
  <text x="60" y="520" class="s">• viewing lead written only after an explicit "yes";</text>
  <text x="60" y="537" class="s">   contact details must appear in the visitor's own words</text>
  <text x="60" y="554" class="s">• each Strands agent capped at 4 model turns, 600 output tokens</text>
  <text x="48" y="582" class="t">Infrastructure as code (AWS CDK, TypeScript)</text>
  <text x="60" y="602" class="s">• AgentStack: runtime, image, role, memory tables, index bucket</text>
  <text x="60" y="619" class="s">• ApiStack: Lambda, Function URL, limits table</text>
  <text x="60" y="636" class="s">• FrontendStack: S3, CloudFront, OAC, SPA function</text>
  <text x="48" y="664" class="t">Idle cost ≈ $0.10–0.30 / month</text>
  <text x="60" y="684" class="s">• no NAT, ALB, Fargate, OpenSearch or provisioned capacity</text>
  <text x="60" y="701" class="s">• ECR images + S3 + logs (7-day retention) only</text>
  <text x="48" y="729" class="t">Evals: routing 44/44 · grounding 20/20 · memory 5/5</text>
  <text x="60" y="747" class="s">• ≤ 4 model calls on every eval question (median 3)</text>
</svg>
