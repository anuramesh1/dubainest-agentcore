<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1040" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13203a"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2747"/>
      <stop offset="1" stop-color="#141f3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.0" r="0.6">
      <stop offset="0" stop-color="#d8b25e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d8b25e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.0" cy="1.0" r="0.6">
      <stop offset="0" stop-color="#5aa0ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5aa0ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b25e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5aa0ff"/>
    </marker>
    <style>
      .lbl{fill:#e7edf7;font-weight:600}
      .sub{fill:#9fb0cc;font-weight:400}
      .tier{fill:#d8b25e;font-weight:700;letter-spacing:3px}
      .tag{fill:#f0d18a;font-weight:600}
      .flow{stroke:#d8b25e;stroke-width:2.2;fill:none}
      .flowB{stroke:#5aa0ff;stroke-width:2;fill:none;stroke-dasharray:6 5}
      .edge{stroke:#22304d;stroke-width:1.4;fill:none}
    </style>
  </defs>

  <rect width="1680" height="1040" fill="url(#bg)"/>
  <rect width="1680" height="1040" fill="url(#glow1)"/>
  <rect width="1680" height="1040" fill="url(#glow2)"/>

  <!-- Title -->
  <text x="60" y="62" font-size="34" class="lbl">DubaiNest&#160;AI — System Architecture</text>
  <text x="60" y="92" font-size="16" class="sub">Multi-agent real-estate assistant · AWS-native · provisioned with AWS CDK (TypeScript)</text>

  <!-- legend -->
  <g transform="translate(1180,52)">
    <line x1="0" y1="10" x2="34" y2="10" class="flow" marker-end="url(#arrow)"/>
    <text x="42" y="15" font-size="13" class="sub">request / data path</text>
    <line x1="0" y1="34" x2="34" y2="34" class="flowB" marker-end="url(#arrowB)"/>
    <text x="42" y="39" font-size="13" class="sub">token stream (SSE)</text>
  </g>

  <!-- ============ TIER 1 · CLIENT ============ -->
  <text x="60" y="150" font-size="13" class="tier">CLIENT</text>
  <g>
    <rect x="60" y="162" width="380" height="92" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="84" y="198" font-size="20" class="lbl">Angular 17 SPA</text>
    <text x="84" y="224" font-size="13.5" class="sub">Chatbot UI · listings · Leaflet map · EN / AR i18n</text>
    <text x="84" y="244" font-size="13.5" class="sub">rich-Markdown streaming responses</text>
  </g>

  <!-- ============ TIER 2 · EDGE ============ -->
  <text x="60" y="306" font-size="13" class="tier">EDGE &#38; DELIVERY</text>
  <g>
    <rect x="60" y="318" width="250" height="96" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="82" y="352" font-size="17" class="lbl">CloudFront</text>
    <text x="82" y="376" font-size="12.5" class="sub">global edge CDN</text>
    <text x="82" y="396" font-size="12.5" class="sub">SPA + /api/* proxy</text>
  </g>
  <g>
    <rect x="334" y="318" width="226" height="96" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="356" y="352" font-size="17" class="lbl">S3</text>
    <text x="356" y="376" font-size="12.5" class="sub">static SPA bundle</text>
    <text x="356" y="396" font-size="12.5" class="sub">+ property photos</text>
  </g>
  <g>
    <rect x="600" y="318" width="226" height="96" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="622" y="352" font-size="17" class="lbl">App Load Balancer</text>
    <text x="622" y="376" font-size="12.5" class="sub">HTTPS · health checks</text>
    <text x="622" y="396" font-size="12.5" class="sub">routes to Fargate</text>
  </g>

  <!-- ============ TIER 3 · COMPUTE ============ -->
  <text x="60" y="466" font-size="13" class="tier">COMPUTE · ECS FARGATE</text>
  <rect x="60" y="478" width="766" height="430" rx="16" fill="#0e1830" stroke="#2a3a5c"/>
  <text x="84" y="508" font-size="18" class="lbl">FastAPI (Python 3.11)</text>
  <text x="84" y="530" font-size="12.5" class="sub">/api/properties · /api/enquiries · /api/chat (SSE)</text>

  <!-- security band -->
  <g>
    <rect x="84" y="546" width="718" height="50" rx="10" fill="#16233f" stroke="#2a3a5c"/>
    <text x="100" y="567" font-size="12.5" class="tag">REQUEST GUARDS</text>
    <text x="100" y="586" font-size="12.5" class="sub">input sanitisation (prompt-injection regex) · 2 000-char cap · rate limit 20/min per IP · sanitised errors</text>
  </g>

  <!-- Agentic core -->
  <text x="100" y="630" font-size="13" class="tier">LANGGRAPH MULTI-AGENT PIPELINE</text>
  <!-- Orchestrator -->
  <g>
    <rect x="100" y="644" width="220" height="86" rx="12" fill="url(#agent)" stroke="#d8b25e" stroke-opacity="0.5"/>
    <text x="120" y="676" font-size="16" class="lbl">Orchestrator</text>
    <text x="120" y="698" font-size="12" class="sub">intent classify</text>
    <text x="120" y="716" font-size="12" class="sub">→ route to specialist</text>
  </g>
  <!-- specialists -->
  <g>
    <rect x="360" y="640" width="210" height="44" rx="10" fill="url(#agent)" stroke="#22304d"/>
    <text x="378" y="668" font-size="14" class="lbl">Property Search</text>
    <rect x="360" y="694" width="210" height="44" rx="10" fill="url(#agent)" stroke="#22304d"/>
    <text x="378" y="722" font-size="14" class="lbl">Market Intelligence</text>
    <rect x="592" y="640" width="210" height="44" rx="10" fill="url(#agent)" stroke="#22304d"/>
    <text x="610" y="668" font-size="14" class="lbl">ROI Calculator</text>
    <rect x="592" y="694" width="210" height="44" rx="10" fill="url(#agent)" stroke="#22304d"/>
    <text x="610" y="722" font-size="14" class="lbl">Scheduler</text>
  </g>
  <!-- orchestrator -> specialists arrows -->
  <path class="flow" d="M320,672 H356" marker-end="url(#arrow)"/>
  <path class="flow" d="M320,700 C338,700 340,716 356,716" marker-end="url(#arrow)"/>

  <!-- shared state / prompt builder -->
  <g>
    <rect x="100" y="752" width="702" height="58" rx="10" fill="#16233f" stroke="#2a3a5c"/>
    <text x="120" y="774" font-size="13" class="tag">SHARED TYPED STATE  ·  SYSTEM-PROMPT BUILDER</text>
    <text x="120" y="794" font-size="12.5" class="sub">agent brief + RAG context + last-3 conversation turns → grounded prompt (never invent numbers)</text>
  </g>
  <g>
    <rect x="100" y="824" width="702" height="62" rx="10" fill="#16233f" stroke="#2a3a5c"/>
    <text x="120" y="846" font-size="13" class="tag">SSE STREAM HANDLER</text>
    <text x="120" y="866" font-size="12.5" class="sub">token-by-token relay · strips &#60;&#60;SUGGESTIONS&#62;&#62; tail into follow-up buttons</text>
  </g>

  <!-- ============ TIER 4 · AI & RAG ============ -->
  <text x="884" y="466" font-size="13" class="tier">AI &#38; RETRIEVAL</text>
  <g>
    <rect x="884" y="478" width="340" height="120" rx="14" fill="url(#card)" stroke="#d8b25e" stroke-opacity="0.5"/>
    <text x="908" y="512" font-size="19" class="lbl">Amazon Bedrock</text>
    <text x="908" y="538" font-size="13.5" class="sub">Claude (inference-profile ARN)</text>
    <text x="908" y="560" font-size="13.5" class="sub">ConverseStream · async guardrail mode</text>
    <text x="908" y="582" font-size="13.5" class="sub">Titan Text embeddings</text>
  </g>
  <g>
    <rect x="884" y="614" width="340" height="96" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="908" y="648" font-size="18" class="lbl">Bedrock Guardrails</text>
    <text x="908" y="672" font-size="12.5" class="sub">content filters · denied topics</text>
    <text x="908" y="692" font-size="12.5" class="sub">PII redaction · contextual grounding</text>
  </g>
  <g>
    <rect x="884" y="726" width="340" height="118" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="908" y="760" font-size="18" class="lbl">RAG · ChromaDB</text>
    <text x="908" y="784" font-size="12.5" class="sub">in-process vector store (Titan / TF-IDF)</text>
    <text x="908" y="804" font-size="12.5" class="sub">query-time area/price/bed filters</text>
    <text x="908" y="824" font-size="12.5" class="sub">31 docs · 100% Recall@5 · re-ingest on boot</text>
  </g>

  <!-- ============ TIER 5 · DATA ============ -->
  <text x="1284" y="466" font-size="13" class="tier">DATA &#38; STORAGE</text>
  <g>
    <rect x="1284" y="478" width="336" height="150" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="1308" y="512" font-size="18" class="lbl">DynamoDB</text>
    <text x="1308" y="536" font-size="12.5" class="sub">on-demand · ByArea / ByDeveloper GSIs</text>
    <text x="1308" y="562" font-size="13" class="tag">properties</text>
    <text x="1418" y="562" font-size="13" class="sub">20 listings · 3 builders</text>
    <text x="1308" y="586" font-size="13" class="tag">leads</text>
    <text x="1308" y="610" font-size="13" class="tag">conversations</text>
  </g>
  <g>
    <rect x="1284" y="644" width="336" height="90" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="1308" y="676" font-size="17" class="lbl">S3 + CloudFront</text>
    <text x="1308" y="700" font-size="12.5" class="sub">media assets bucket</text>
    <text x="1308" y="720" font-size="12.5" class="sub">property photos (22 objects)</text>
  </g>
  <g>
    <rect x="1284" y="750" width="336" height="94" rx="14" fill="url(#card)" stroke="#22304d"/>
    <text x="1308" y="782" font-size="17" class="lbl">CloudWatch</text>
    <text x="1308" y="806" font-size="12.5" class="sub">logs · metrics · dashboards</text>
    <text x="1308" y="826" font-size="12.5" class="sub">AWS Budgets alarm ($10/mo)</text>
  </g>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- client -> cloudfront -->
  <path class="flow" d="M185,254 V318" marker-end="url(#arrow)"/>
  <!-- cloudfront <-> s3 -->
  <path class="edge" d="M310,366 H334"/>
  <!-- cloudfront -> ALB -->
  <path class="flow" d="M310,386 C420,386 500,366 600,366" marker-end="url(#arrow)"/>
  <!-- ALB -> fargate -->
  <path class="flow" d="M713,414 V478" marker-end="url(#arrow)"/>
  <!-- fargate compute -> bedrock -->
  <path class="flow" d="M826,560 C850,560 858,538 884,538" marker-end="url(#arrow)"/>
  <!-- bedrock -> guardrails -->
  <path class="edge" d="M1054,598 V614"/>
  <!-- fargate -> RAG -->
  <path class="flow" d="M826,785 H884" marker-end="url(#arrow)"/>
  <!-- RAG -> bedrock embeddings (up) -->
  <path class="edge" d="M1054,726 V710"/>
  <!-- token stream back: bedrock -> fargate -> ALB -> CF -> client -->
  <path class="flowB" d="M884,580 C856,580 852,860 826,860" marker-end="url(#arrowB)"/>
  <!-- fargate <-> dynamo -->
  <path class="flow" d="M826,640 C1180,640 1120,560 1284,553" marker-end="url(#arrow)"/>
  <!-- fargate -> cloudwatch -->
  <path class="edge" d="M826,885 C1100,980 1452,980 1452,844"/>

  <!-- ============ IaC FOOTER ============ -->
  <g>
    <rect x="60" y="936" width="1560" height="74" rx="14" fill="#0e1830" stroke="#2a3a5c"/>
    <text x="84" y="966" font-size="13" class="tier">INFRASTRUCTURE AS CODE · AWS CDK (TypeScript) · 5 STACKS</text>
    <g font-size="14" class="lbl">
      <rect x="84" y="978" width="150" height="24" rx="12" fill="#16233f" stroke="#22304d"/><text x="104" y="995">Network</text>
      <rect x="250" y="978" width="150" height="24" rx="12" fill="#16233f" stroke="#22304d"/><text x="270" y="995">Data</text>
      <rect x="416" y="978" width="150" height="24" rx="12" fill="#16233f" stroke="#22304d"/><text x="436" y="995">Backend</text>
      <rect x="582" y="978" width="150" height="24" rx="12" fill="#16233f" stroke="#22304d"/><text x="602" y="995">Frontend</text>
      <rect x="748" y="978" width="180" height="24" rx="12" fill="#16233f" stroke="#22304d"/><text x="768" y="995">Observability</text>
    </g>
    <text x="980" y="995" font-size="13" class="sub">On-demand start/stop · always-up Data + Frontend · ~$0/mo idle, ~$78/mo live · CI/CD via GitHub Actions</text>
  </g>
</svg>
